<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
  <title>Overlay InfoHardware</title>
  <style>
    html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
    #box { display: inline-block; padding: 8px 12px; border-radius: 10px; background: rgba(11, 10, 18, .82); border: 1px solid rgba(168, 85, 247, .55);
      box-shadow: 0 0 14px rgba(168, 85, 247, .35); font: 600 13px/1.5 "Segoe UI", system-ui, sans-serif; color: #ece9ff; transform-origin: top left; white-space: nowrap; }
    .r { display: flex; gap: 10px; justify-content: space-between; }
    .k { color: #a855f7; min-width: 44px; }
    .k.c { color: #22d3ee; } .k.p { color: #ff3cac; } .k.g { color: #39ff88; } .k.o { color: #ffb020; }
    .fps { font-size: 22px; font-weight: 800; color: #22d3ee; text-shadow: 0 0 10px rgba(34, 211, 238, .6); }
    .dim { color: #9a93c0; font-weight: 500; }
  </style>
</head>
<body>
  <div id="box"><div class="dim">InfoHardware</div></div>
  <script src="overlay.js"></script>
</body>
</html>
